name: maritime-ops

services:
  postgres:
    image: timescale/timescaledb-postgis:pg16-ts2.17
    container_name: maritime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maritime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-maritime}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maritime}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: maritime-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maritime-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://maritime:change-me-in-production@postgres:5432/maritime}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 4000
      API_PREFIX: ${API_PREFIX:-/api/v1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-string}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      AISSTREAM_BBOXES: ${AISSTREAM_BBOXES:--180,-90,180,90}
      AISSTREAM_ENABLED: ${AISSTREAM_ENABLED:-true}
      AISHUB_API_KEY: ${AISHUB_API_KEY:-}
      AISHUB_ENABLED: ${AISHUB_ENABLED:-false}
      AISHUB_POLL_INTERVAL_MS: ${AISHUB_POLL_INTERVAL_MS:-60000}
      NMEA_ENABLED: ${NMEA_ENABLED:-false}
      NMEA_UDP_PORT: ${NMEA_UDP_PORT:-10110}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      OPEN_METEO_CACHE_TTL_MS: ${OPEN_METEO_CACHE_TTL_MS:-3600000}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:4000/api/v1}
        VITE_WS_BASE: ${VITE_WS_BASE:-ws://localhost:4000/ws}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-https://demotiles.maplibre.org/style.json}
    container_name: maritime-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
  redis-data:
